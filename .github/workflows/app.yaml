name: Application

on:
  push:
    branches:
      - main
      - uat
      - develop
  pull_request:
    branches:
      - main
      - uat

env:
  IMAGE_NAME: ${{ github.event.repository.name }}/api-demo

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      
      - name: .NET install
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore src/ApiDemo.slnx

      - name: Build
        run: dotnet build src/ApiDemo.slnx --configuration Release --no-restore

      - name: Tests
        run: dotnet test src/ApiDemo.slnx --configuration Release --no-build --verbosity normal

  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t ${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME:${{ github.sha }} -f infra/Dockerfile src/ApiDemo

      - name: Push to ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/$IMAGE_NAME:${{ github.sha }}



